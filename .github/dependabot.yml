# The cooldown lets a compromised publish be noticed before we propose it. It
# applies to version updates only -- security updates ignore it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      github-actions:
        patterns:
          - "*"  # Group all Actions updates into a single pull request
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: "thursday"
      time: "08:00"
      timezone: "America/New_York"

  # Note: Rust dependencies are not handled here. For those
  # dependencies, we want Dependabot only for security updates, which is
  # already enabled through GitHub repository settings.
